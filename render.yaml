services:
  - type: web
    name: trend-assistant-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: YOUTUBE_REGION_CODE
        value: "BD"
      - key: TREND_CHECK_INTERVAL_HOURS
        value: "6"
      - key: CONTENT_NICHE
        value: "general"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
